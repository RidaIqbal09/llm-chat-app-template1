<!DOCTYPE html>
<html>

<head>
    <title>Chat History</title>

    <style>
        body {
            font-family: Arial;
            background: #f5f5f5;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
        }

        h2 {
            text-align: center;
        }

        .msg {
            background: #eee;
            padding: 10px;
            margin: 8px 0;
            border-radius: 8px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
        }

        button {
            padding: 8px 12px;
            background: blue;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }

        a {
            text-decoration: none;
            color: white;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="top-bar">
        <button onclick="loadHistory()">Refresh</button>
        <button>
            <a href="index.html">Back Chat</a>
        </button>
    </div>

    <h2>Chat History</h2>

    <div id="history"></div>

</div>

<script>

// IMPORTANT: apna deployed worker URL yahan lagao
const API = "http://127.0.0.1:8787";

async function loadHistory() {

    let res = await fetch(API + "/history");

    let data = await res.json();

    let box = document.getElementById("history");

    box.innerHTML = "";

    if (data.length === 0) {
        box.innerHTML = "<p>No messages yet</p>";
        return;
    }

    data.forEach(item => {

        box.innerHTML += `
            <div class="msg">
                💬 ${item.message}
            </div>
        `;
    });
}

loadHistory();

</script>

</body>
</html>
